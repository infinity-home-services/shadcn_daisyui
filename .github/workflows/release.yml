name: Release

# Every version gets a tag and a GitHub release - no gaps. Changes reach main
# through a pull request with green checks, so a release only ever comes from
# a tested commit. On each push to main, scripts/github_release.sh reads
# @version from mix.exs: a version with no vX.Y.Z tag yet is tagged at the
# commit that set it, and a tag with no GitHub release gets one (titled from
# "Release X.Y.Z - summary", notes from CHANGELOG.md's "## [X.Y.Z]" section).
# It fails if that section is missing. Run it by hand with "backfill" to create
# releases for older tags that never got one.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also create releases for older v* tags that have none"
        type: boolean
        default: false

permissions:
  contents: write

# one at a time, so two merges in quick succession don't both create the release
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # a run by hand on another branch must not release that branch's version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # all history and tags

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [ "${{ inputs.backfill }}" = "true" ]; then args+=(--backfill); fi
          scripts/github_release.sh "${args[@]}"
