name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            demo/deps
            demo/_build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock', 'demo/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Package - deps, format, test, build
        run: |
          mix deps.get
          mix format --check-formatted
          mix test
          mix hex.build

      - name: Demo - deps, format, test
        working-directory: demo
        run: |
          mix deps.get
          mix format --check-formatted
          mix test

  # A merge to main releases a new version on its own, so a version that can't
  # be released (no CHANGELOG section, mix.exs and package.json disagree) has to
  # fail here, before the merge.
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # all history and tags

      - name: Dry-run the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: "1"
        run: scripts/github_release.sh
