<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
  <!-- The docs site's stand-in for an app's sign-in picture: soft grey waves
       and fine strands on black, light from the top right. Drawn here, no
       outside artwork. -->
  <defs>
    <radialGradient id="light" cx="1" cy="0" r="1.1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.45" stop-color="#121212"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>
    <radialGradient id="tint" cx="1" cy="1" r="0.8">
      <stop offset="0" stop-color="#1d4a5a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1d4a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.09"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#light)"/>
  <rect width="1200" height="1500" fill="url(#tint)"/>
