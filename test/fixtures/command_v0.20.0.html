<button type="button" class="btn btn-outline w-64 justify-between" phx-click="[[&quot;dispatch&quot;,{&quot;to&quot;:&quot;#cmd&quot;,&quot;event&quot;:&quot;shadcn:show-modal&quot;}]]">
  <span class="text-muted-foreground">Search…</span>

</button>

  </div>
  <ul id="cmd-list" data-command-list class="max-h-80 overflow-auto p-1">
    
      <li class="command-group-label" data-group>Pages</li>
      <li>
        <a href="/home" data-phx-link="redirect" data-phx-link-state="push" id="page" class="command-item" data-command-item>
  <span class="hero-home size-4" aria-hidden="true"></span>
Home
<span class="ml-auto text-xs text-muted-foreground">
  ⌘H
</span>
</a>


      </li><li>
        <a href="/home?tab=2" data-phx-link="patch" data-phx-link-state="push" id="patched" class="command-item" data-command-item>
  
Tab two

</a>


      </li>
    
      <li class="command-group-label" data-group>Brands</li>
      <li>
        <a href="/context/brand?brand=acme" id="brand" class="command-item" data-command-item>
  
Acme

</a>


      </li>
    
      <li class="command-group-label" data-group>Locations</li>
      <li>
        
<button type="submit" id="loc" form="loc-form" name="location" value="all" class="command-item" data-command-item>
  
All locations

</button>

      </li>
    
      
      <li>
        

<button type="button" id="act" class="command-item" data-command-item phx-click="refresh">
  
Refresh

</button>
      </li><li>
        

<button type="button" class="command-item" data-command-item>
  
Plain

</button>
      </li>
    
  </ul>
  <p data-command-empty class="hidden p-6 text-center text-sm text-muted-foreground">
    No results found.
  </p>
  <div id="cmd-toasts" data-toast-host phx-update="ignore"></div>
</dialog>
