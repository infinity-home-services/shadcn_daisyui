    <script>
      (() => {
        const setTheme = (theme) => {
          // Disable transitions for the swap so light↔dark doesn't fade-flicker,
          // then re-enable on the next frame (mirrors setTheme/0 in shadcn-daisyui.js).
          const el = document.documentElement;
          el.classList.add("theme-transition");
          if (theme === "system") {
            localStorage.removeItem("phx:theme");
            el.removeAttribute("data-theme");
          } else {
            localStorage.setItem("phx:theme", theme);
            el.setAttribute("data-theme", theme);
          }
          requestAnimationFrame(() =>
            requestAnimationFrame(() => el.classList.remove("theme-transition"))
          );
        };
        if (!document.documentElement.hasAttribute("data-theme")) {
          setTheme(localStorage.getItem("phx:theme") || "shadcn");
        }
        // <.app_shell>: the sidebar's collapsed or open state, before first paint
        document.documentElement.dataset.sidebar =
          localStorage.getItem("shadcn:sidebar") === "collapsed" ? "collapsed" : "open";
        window.addEventListener("storage", (e) => e.key === "phx:theme" && setTheme(e.newValue || "system"));

        window.addEventListener("phx:set-theme", (e) => setTheme(e.target.dataset.phxTheme));
      })();
    </script>
